<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e1a">
  <title>Huddle – group chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <!-- ===== Join screen ===== -->
  <main id="join" class="join">
    <form id="joinForm" class="join-card glass" novalidate>
      <div class="join-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>
      </div>
      <h1>Huddle</h1>
      <p class="lede">One room, everyone in it. Pick a name to step inside.</p>
      <label for="nameInput">Username</label>
      <input id="nameInput" type="text" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Naveen" autofocus>
      <p id="joinError" class="form-error" role="alert"></p>
      <button id="joinBtn" type="submit" class="btn-primary">Join the room</button>
      <p class="fine">Names are unique while you’re online · Letters, numbers, spaces, dots and dashes.</p>
    </form>
  </main>

  <!-- ===== Chat app ===== -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar glass" aria-label="Online users">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>
        </div>
        <span class="brand-name">Huddle</span>
        <button id="closeSidebar" class="icon-btn only-mobile" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="side-title">
        <span>Online now</span>
        <span id="sideCount" class="count-badge">0</span>
      </div>
      <ul id="userList" class="user-list"></ul>

      <div class="me-card">
        <div id="meAvatar" class="avatar"></div>
        <div class="me-info">
          <strong id="meName"></strong>
          <span id="meId" class="muted" title="Your unique Socket.IO ID"></span>
        </div>
        <button id="leaveBtn" class="icon-btn" type="button" title="Leave room" aria-label="Leave room">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <section id="chat" class="chat glass">
      <header class="chat-head">
        <button id="menuBtn" class="icon-btn only-mobile" type="button" aria-label="Show online users">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="head-text">
          <h2>Common room</h2>
          <p><span class="dot"></span><span id="onlineCount">0</span> online</p>
        </div>
        <span id="conn" class="conn" hidden>Reconnecting…</span>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Messages"></div>
      <button id="jumpBtn" class="jump" type="button" hidden>New messages ↓</button>

      <div id="typing" class="typing" aria-live="polite"></div>
      <div id="uploads" class="uploads"></div>

      <footer class="composer">
        <div id="picker" class="picker glass" hidden>
          <p class="picker-hint">Tap to send instantly</p>
          <div id="quickEmoji" class="quick"></div>
          <p class="picker-hint">Tap to add to your message · double-click to send</p>
          <div id="emojiGrid" class="emoji-grid"></div>
        </div>

        <button id="attachBtn" class="icon-btn" type="button" title="Attach files" aria-label="Attach files">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
        </button>
        <button id="emojiBtn" class="icon-btn" type="button" title="Emoji" aria-label="Open emoji picker" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Write a message…  (Enter to send, Shift+Enter for a new line)" aria-label="Message" maxlength="2000"></textarea>
        <button id="sendBtn" class="send" type="button" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </footer>
    </section>
  </div>

  <div id="reactBar" class="react-bar glass" hidden></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <input id="fileInput" type="file" multiple hidden>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
